# Docker Compose configuration for Valheim Dedicated Server on Oracle Cloud Ampere A1 (ARM64)
# Architecture: Native linux/arm64 container with Box64 (Valheim x86_64) and Box86 (SteamCMD x86 32-bit)
# NOTE: Do NOT add "platform: linux/amd64" here. This is a native ARM64 deployment.

services:
  valheim:
    # Build locally from repository:
    build:
      context: .
      args:
        TARGETARCH: arm64
        BOX64_TARGET: ADLINK   # Optimized for Ampere Altra (Neoverse N1)
        BOX86_TARGET: ADLINK
    image: valheim-server:arm64
    container_name: valheim-server-arm64
    restart: unless-stopped

    # stop_grace_period is CRITICAL: Gives Unity enough time to flush and save
    # world state to disk upon receiving SIGTERM/SIGINT before Docker issues SIGKILL.
    stop_grace_period: 2m

    # Required Linux capability for thread priority tuning in Valheim/Unity
    cap_add:
      - SYS_NICE

    # Security: No privileged mode, no docker socket mount
    security_opt:
      - no-new-privileges:true

    ports:
      # Valheim gameplay and server query UDP ports
      - "2456-2458:2456-2458/udp"
      # Optional: Supervisor HTTP status interface (disabled by default)
      # - "9001:9001/tcp"

    volumes:
      # World save files, configuration, adminlist, and automatic backups
      - ./valheim-data/config:/config
      # Dedicated server files downloaded via SteamCMD
      - ./valheim-data/server:/opt/valheim
      # Box64 runtime configuration for Ampere A1 stability
      - ./box64.box64rc:/etc/box64.box64rc:ro

    env_file:
      - valheim.env

    # Resource limits recommended for Oracle Cloud Ampere A1 (Always Free tier offers up to 4 OCPUs and 24 GB RAM)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 8G
